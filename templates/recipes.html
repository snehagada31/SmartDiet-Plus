<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy & Delicious Homemade Recipes</title>
    <style>
        /* Your existing CSS (as provided in your HTML) */
        body {
            font-family: sans-serif; /* Replace with your website's font if different */
            margin: 0;
            background-color: #f4f4f4; /* Light grey background */
            color: #333;
        }

        .recipe-container {
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .recipe-sidebar {
            width: 250px;
            padding-right: 20px;
            border-right: 1px solid #ddd;
        }

        .recipe-sidebar h3 {
            color: #388e3c; /* Primary green color */
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group h4 {
            color: #555;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .filter-group input[type="checkbox"] {
            margin-right: 5px;
        }

        /* Updated button ID to match JS and general class name for consistency */
        #applyFiltersBtn { /* Changed from #apply-filters */
            background-color: #388e3c; /* Primary green color */
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        #applyFiltersBtn:hover { /* Changed from .button:hover */
            background-color: #2e7d32; /* Darker shade of green */
        }

        .recipe-list {
            flex-grow: 1;
            padding-left: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .recipe-card {
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        }

        .recipe-card img {
            width: 100%;
            height: auto;
            margin-bottom: 10px;
            border-radius: 5px;
            display: block;
        }

        .recipe-card h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.2em;
            color: #333;
        }

        .recipe-card p {
            color: #777;
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        .recipe-card .view-recipe {
            background-color: #f0ad4e; /* A different accent color */
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.3s ease;
        }

        .recipe-card .view-recipe:hover {
            background-color: #e09538;
        }

        /* Modal Styling - Harmonized with your existing structure */
        .modal { /* Changed class from .recipe-detail-modal */
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            top: 0;
            left: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            background-color: rgba(0, 0, 0, 0.5); /* Black w/ opacity */
            z-index: 1000;
            justify-content: center; /* Use flexbox for centering */
            align-items: center; /* Use flexbox for centering */
            overflow: auto; /* Enable scroll if content is too large */
        }

        .modal-content { /* Changed class from .recipe-detail-content */
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 700px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .modal-content h2 { /* Changed from .recipe-detail-content h2 */
            color: #388e3c;
            margin-top: 0;
            margin-bottom: 15px;
        }

        #modalRecipeImage { /* Changed ID from #recipeDetailImage */
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            border-radius: 5px;
            display: block;
        }

        .modal-content h3 { /* Changed from .recipe-detail-content h3 */
            color: #555;
            margin-top: 15px;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        #modalRecipeIngredients, /* Changed ID from #recipeDetailIngredients */
        #modalRecipeInstructions { /* Changed ID from #recipeDetailInstructions */
            padding-left: 20px;
            margin-bottom: 15px;
            list-style-type: disc;
            color: #666;
        }

        #modalRecipeInstructions { /* Ensure instructions are ordered */
            list-style-type: decimal;
        }

        /* Added new ID for YouTube link container */
        #modalYoutubeLink {
            margin-top: 20px;
            text-align: center; /* Center the YouTube link */
        }

        #modalYoutubeLink a {
            display: inline-block;
            background-color: #FF0000; /* YouTube red */
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        #modalYoutubeLink a:hover {
            background-color: #CC0000;
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5em;
            cursor: pointer;
            border: none;
            background: none;
            color: #777;
        }

        .close-button:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="recipe-container">
        <aside class="recipe-sidebar">
            <h3>Filter Recipes</h3>
            <div class="filter-group">
                <h4>Dietary Preference</h4>
                <label><input type="checkbox" name="diet" value="vegetarian"> Vegetarian</label><br>
                <label><input type="checkbox" name="diet" value="non-vegetarian"> Non-Vegetarian</label><br>
                <label><input type="checkbox" name="diet" value="gluten-free"> Gluten-Free</label><br>
                <label><input type="checkbox" name="diet" value="vegan"> Vegan</label><br>
            </div>

            <div class="filter-group">
                <h4>Allergies</h4>
                <label><input type="checkbox" name="allergy" value="nuts"> Nuts</label><br>
                <label><input type="checkbox" name="allergy" value="dairy"> Dairy</label><br>
                <label><input type="checkbox" name="allergy" value="soy"> Soy</label><br>
            </div>

            <button id="applyFiltersBtn" class="button">Apply Filters</button>
        </aside>

        <main class="recipe-list" id="recipeList">
            </main>

        <div id="recipeModal" class="modal"> <div class="modal-content"> <button class="close-button">&times;</button>
                <h2 id="modalRecipeTitle"></h2> <img id="modalRecipeImage" src="" alt=""> <h3>Ingredients:</h3>
                <ul id="modalRecipeIngredients"></ul> <h3>Instructions:</h3>
                <ol id="modalRecipeInstructions"></ol> <div id="modalYoutubeLink"></div> </div>
        </div>
    </div>

<script src="/static/recipes.js"></script>
</body>
</html>
