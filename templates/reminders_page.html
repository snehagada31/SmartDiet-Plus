<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Reminders - SmartDiet+</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .reminders-container { 
            max-width: 600px; margin: 50px auto; padding: 30px; 
            background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { color: #00796B; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; color: #555; }
        input[type="text"], textarea { 
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; 
        }
        .btn-submit { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="reminders-container">
        <h2>Manage Intake Reminders</h2>
        <a href="{{ url_for('login_bp.profile') }}">← Back to Profile</a>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login_bp.reminders_settings') }}">
            <div class="form-group">
                <input type="checkbox" id="water_reminder" name="water_reminder" 
                       {% if settings.water_active %} checked {% endif %}>
                <label for="water_reminder" style="display: inline-block; margin-left: 10px;">
                    Enable Water Intake Reminders
                </label>
            </div>

            <div class="form-group">
                <label for="reminder_times">Set Times (Comma separated)</label>
                <textarea id="reminder_times" name="reminder_times" rows="3" 
                          placeholder="e.g., 10:00 AM, 2:00 PM, 5:00 PM">{{ settings.water_times | join(', ') }}</textarea>
            </div>

            <button type="submit" class="btn-submit">Save Reminders</button>
        </form>
    </div>
</body>
</html>
